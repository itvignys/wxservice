# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.wxlogin.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # 开启自动建表（开发环境）
  bootstrap: true

# 日志配置
logging:
  level:
    com.example.wxlogin: debug

# 元宝AI配置
yuanbao:
  api-key: ${YUANBAO_API_KEY:sk-e4xlTZqHg748DkZv16idTfTDXN7jEaOihz3KlGABWzCoz07s}
  model: ${YUANBAO_MODEL:minimax-m2.5}
  endpoint: ${YUANBAO_ENDPOINT:https://tokenhub.tencentmaas.com/v1/chat/completions}
  max-context-rounds: 10
  timeout: 30000
